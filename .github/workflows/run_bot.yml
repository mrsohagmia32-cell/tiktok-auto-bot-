name: Run TikTok Auto Bot

on:
  workflow_dispatch: # এটি দিলে গিটহাব ড্যাশবোর্ড থেকে সরাসরি 'Run workflow' বাটন পাওয়া যাবে
    inputs:
      target_url:
        description: 'Target Profile Link'
        required: true
        default: 'https://www.tiktok.com/@tiktok'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests playwright
        playwright install chromium

    - name: Run Automation Script
      env:
        TARGET_URL: ${{ github.event.inputs.target_url }}
      run: |
        python main.py
