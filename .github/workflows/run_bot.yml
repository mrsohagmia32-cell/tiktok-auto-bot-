name: TikTok SMM Automation Order

on:
  workflow_dispatch:
    inputs:
      target_username:
        description: 'Enter TikTok Username (e.g. username)'
        required: true
        default: 'tiktok'
      follow_count:
        description: 'How many actions/follows to perform?'
        required: true
        default: '1'

jobs:
  process_order:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install playwright
        playwright install chromium

    - name: Run Order Script
      env:
        TARGET_USERNAME: ${{ github.event.inputs.target_username }}
        FOLLOW_COUNT: ${{ github.event.inputs.follow_count }}
        BOT_COOKIES: ${{ secrets.BOT_COOKIES }}
      run: |
        python main.py
